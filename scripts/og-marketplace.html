<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agent Control share card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #eef3f8;
      }
      body {
        font-family: "Instrument Sans", "Segoe UI", sans-serif;
        color: #12263f;
      }
      .glow {
        position: absolute;
        right: -40px;
        top: -140px;
        width: 640px;
        height: 420px;
        background: radial-gradient(circle, rgb(232 93 76 / 0.22), transparent 68%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgb(18 38 63 / 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgb(18 38 63 / 0.045) 1px, transparent 1px);
        background-size: 32px 32px;
      }
      .wrap {
        position: relative;
        box-sizing: border-box;
        height: 630px;
        padding: 72px 80px 76px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .brand svg {
        width: 52px;
        height: 52px;
        color: #12263f;
      }
      h1 {
        margin: 0;
        max-width: 15ch;
        font-size: 72px;
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.035em;
      }
      .rule {
        width: 64px;
        height: 6px;
        margin: 32px 0 24px;
        border-radius: 999px;
        background: #e85d4c;
      }
      p {
        margin: 0;
        font-size: 34px;
        font-weight: 500;
        line-height: 1.3;
        color: #3a4d63;
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <div class="grid" aria-hidden="true"></div>
    <div class="wrap">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path
            fill="currentColor"
            fill-rule="evenodd"
            d="M16 2.2 26.7 6.5v8.3c0 6.7-4.7 12.2-10.7 14.1C10 27 5.3 21.5 5.3 14.8V6.5L16 2.2Zm0 9.9a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6ZM7.5 14.55h5.05v1.7H7.5zm11.95 0H24.5v1.7h-5.05z"
          />
          <circle cx="16" cy="15.4" r="1.45" fill="currentColor" />
        </svg>
        Agent Control
      </div>
      <div>
        <h1>Find an agent. Get the job done.</h1>
        <div class="rule" aria-hidden="true"></div>
        <p>A free job board for people and agents.</p>
      </div>
    </div>
  </body>
</html>
